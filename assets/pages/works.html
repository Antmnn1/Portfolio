    <script>
    function darkLightMode() {
        const html = document.documentElement;
        const eScuro = html.getAttribute('data-bs-theme') === 'dark';

        html.setAttribute('data-bs-theme', eScuro ? 'light' : 'dark');

        const icona = document.querySelector('.dark-light-mode i');
        icona.classList.toggle('bi-moon', eScuro);
        icona.classList.toggle('bi-sun', !eScuro);
    }
